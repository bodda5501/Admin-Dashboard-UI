<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admin Analytics Dashboard UI" />
    <title>Admin Dashboard | Bodda Waleed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>

  <body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <ul class="nav-list">
        <li class="profile">
          <div class="img-box">
            <img src="img/img.jpg" alt="Bodda Profile" />
          </div>
          <h2>Bodda</h2>
        </li>
        <li>
          <a href="#" class="nav-link active" data-title="Dashboard">
            <i class="fas fa-home"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-title="Clients">
            <i class="fas fa-user-group"></i>
            <span>Clients</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-title="Products">
            <i class="fas fa-table"></i>
            <span>Products</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-title="Charts">
            <i class="fas fa-chart-pie"></i>
            <span>Charts</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-title="Posts">
            <i class="fas fa-pen"></i>
            <span>Posts</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-title="Favorites">
            <i class="fas fa-star"></i>
            <span>Favorites</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-title="Settings">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
          </a>
        </li>
        <li class="log-out">
          <a href="#" class="nav-link">
            <i class="fas fa-sign-out-alt"></i>
            <span>Log out</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Dashboard Content -->
    <main class="content">
      <header class="title-info">
        <div class="title-left">
          <button id="menu-toggle" class="menu-btn" aria-label="Toggle Menu">
            <i class="fas fa-bars"></i>
          </button>
          <p id="page-title">Dashboard</p>
        </div>
        <i class="fas fa-chart-bar"></i>
      </header>

      <!-- Stats Cards -->
      <section class="data-info" aria-label="Key Metrics">
        <div class="box">
          <i class="fas fa-user"></i>
          <div class="data">
            <p>Users</p>
            <span class="counter" data-target="100">0</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-pen"></i>
          <div class="data">
            <p>Posts</p>
            <span class="counter" data-target="765">0</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-table"></i>
          <div class="data">
            <p>Products</p>
            <span class="counter" data-target="34">0</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-dollar-sign"></i>
          <div class="data">
            <p>Revenue</p>
            <span class="counter" data-target="156" data-prefix="$">$0</span>
          </div>
        </div>
      </section>

      <!-- Products Table -->
      <div class="title-info">
        <p>Products Inventory</p>
        <i class="fas fa-table"></i>
      </div>

      <section class="table-container" aria-label="Products Table">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Count</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Smart TV 4K</td>
              <td><span class="price">$165</span></td>
              <td><span class="count">65</span></td>
            </tr>
            <tr>
              <td>Design Handbook</td>
              <td><span class="price">$321</span></td>
              <td><span class="count">45</span></td>
            </tr>
            <tr>
              <td>Stylus Pen</td>
              <td><span class="price">$12</span></td>
              <td><span class="count">32</span></td>
            </tr>
            <tr>
              <td>Standing Desk</td>
              <td><span class="price">$98</span></td>
              <td><span class="count">78</span></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <script src="js/script.js" defer></script>
  </body>
</html>
